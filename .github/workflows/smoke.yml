# После каждой отправки в main ждёт, пока Vercel выложит этот коммит, и прогоняет смоук-тест
# на живом сайте в настоящем браузере. Упал — GitHub пришлёт письмо, в логе видно, какая проверка не прошла.
name: Смоук-тест после выкладки

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BASE: https://lovesick-radio.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Ждём, пока Vercel выложит этот коммит
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 40); do
            v=$(curl -s --max-time 30 "$BASE/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$v" = "$GITHUB_SHA" ]; then echo "Выложено: $v"; exit 0; fi
            echo "Пока на сайте версия ${v:-?}, ждём…"; sleep 15
          done
          echo "::error::За 10 минут Vercel так и не выложил коммит $GITHUB_SHA"; exit 1

      - name: Смоук-тест
        run: npm run test:smoke
